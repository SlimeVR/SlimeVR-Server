packages:
  - "solarxr-protocol"
  - "gui/app"
  - "gui/app-next"
  - "gui/electron"
  - "gui/shared"
  - "!solarxr-protocol/lib/flatbuffers/**"

allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  '@swc/core': true
  electron-winstaller: true
  esbuild: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@boundaries/elements@3.2.0'
  - eslint-plugin-boundaries@7.3.0
