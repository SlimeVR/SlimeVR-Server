# Crowdin Configuration File
# https://developer.crowdin.com/configuration-file/

project_id: "2"
project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN

files:
  - source: /gui/app/public/i18n/en/translation.ftl
    translation: /gui/app/public/i18n/%locale%/%original_file_name%
    languages_mapping:
      locale:
        zh-CN: zh-Hans
        zh-TW: zh-Hant
        nb: nb-NO
        nb-NO: nb-NO
        sv: sv-SE
        sv-SE: sv-SE
        en-OWO: en-x-owo
        owo: en-x-owo
