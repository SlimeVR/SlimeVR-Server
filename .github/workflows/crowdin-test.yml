name: Test Crowdin Sync (Dry Run)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Perform a dry run (logs changes without modifying repository)'
        type: boolean
        default: true
      localization_branch:
        description: 'Branch to target for translations'
        type: string
        default: 'l10n_main'

jobs:
  test-crowdin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Test Crowdin Synchronization
        uses: crowdin/github-action@v2
        with:
          upload_sources: true
          upload_translations: false
          download_translations: true
          localization_branch_name: ${{ inputs.localization_branch }}
          dry_run: ${{ inputs.dry_run }}
          create_pull_request: false
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          CROWDIN_API_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
