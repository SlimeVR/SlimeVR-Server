# This workflow will rebase `l10n_main` and `pontoon` with `main` changes, it's for making the
# translation bots not try making commits to main

name: Rebase translation branches to main
on:
  push:
    branches:
      - main

jobs:
  rebase-l10n:
    if: ${{ github.repository == 'SlimeVR/SlimeVR-Server' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: l10n_main
          # Get all the git history for rebasing
          fetch-depth: 0
      - name: Rebase
        run: |
          git config --local user.name "slimevr-bot"
          git config --local user.email 'pantoon@slimevr.dev'
          git fetch origin main
          git rebase origin/main
      - name: Push rebase
        uses: github-actions-x/commit@v2.9
        with:
          github-token: ${{ secrets.PONTOON_BOT_KEY }}
          push-branch: "l10n_main"
          commit-message: "update"
          force-push: "true"
          name: "slimevr-bot"
          email: "pantoon@slimevr.dev"

  rebase-pontoon:
    if: ${{ github.repository == 'SlimeVR/SlimeVR-Server' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: pontoon
          # Get all the git history for rebasing
          fetch-depth: 0
      - name: Rebase
        run: |
          git config --local user.name "slimevr-bot"
          git config --local user.email 'pantoon@slimevr.dev'
          git fetch origin main
          git rebase origin/main
      - name: Push rebase
        uses: github-actions-x/commit@v2.9
        with:
          github-token: ${{ secrets.PONTOON_BOT_KEY }}
          push-branch: "pontoon"
          commit-message: "update"
          force-push: "true"
          name: "slimevr-bot"
          email: "pantoon@slimevr.dev"
