name: Update translations in main
on:
  push:
    branches:
      - pontoon
      - l10n_main
jobs:
  pull_request:
    if: ${{ github.repository == 'SlimeVR/SlimeVR-Server' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - name: pull-request
        env:
          GH_TOKEN: ${{ secrets.PONTOON_BOT_KEY }}
        run: |
          gh_pr_up() { gh pr create "$@" --draft --base main || gh pr edit "$@"; }
          gh_pr_up --title "New translations" --body "Please don't squash me 🥺"
