name: Crowdin Sync

on:
  push:
    branches:
      - server-rewrite
  workflow_dispatch:
    inputs:
      upload_translations:
        description: 'Upload existing translations to Crowdin (Use only for initial import!)'
        type: boolean
        default: false

jobs:
  sync-crowdin:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Crowdin Synchronization
        uses: crowdin/github-action@v2
        with:
          upload_sources: true
          upload_translations: ${{ inputs.upload_translations || false }}
          download_translations: true
          skip_untranslated_strings: true
          localization_branch_name: ${{ github.ref_name }}
          crowdin_branch_name: ${{ github.ref_name }}
          create_pull_request: true
          pull_request_title: 'New Crowdin Translations'
          pull_request_body: 'Automatic Pull Request updating translations from Crowdin.'
          pull_request_base_branch_name: ${{ github.ref_name }}
          project_id: ${{ secrets.CROWDIN_PROJECT_ID }}
          token: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          base_url: 'https://slimevr.api.crowdin.com'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
